name: Build LovelyKent APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unzip project
        run: |
          unzip -q LovelyKent-project.zip -d work
          ls work/LovelyKent

      - name: Build debug APK
        working-directory: work/LovelyKent
        run: gradle assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK=$(find work/LovelyKent/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/LovelyKent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LovelyKent-APK
          path: dist/LovelyKent.apk
          if-no-files-found: error
